[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# UI: GPUI Kit pins the matching GPUI snapshot and re-exports gpui, base, component, assets.
gpui-kit = { version = "0.9.1", features = ["syntect"] }

# Typesetting
typst = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = "0.15.1"
typst-syntax = "0.15.1"
hayro = "0.9.0"

# Common
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
smol = "2"
async-channel = "2"
dirs = "6"
which = "8"
walkdir = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Typesetting and rasterizing are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
