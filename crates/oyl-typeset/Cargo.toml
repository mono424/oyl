[package]
name = "oyl-typeset"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
oyl-model = { path = "../oyl-model" }
typst.workspace = true
typst-render.workspace = true
typst-pdf.workspace = true
typst-syntax.workspace = true
typst-kit = { workspace = true, features = [
    "embedded-fonts",
    "scan-fonts",
    "system-packages",
    "datetime",
] }
# Same versions Typst 0.15.1 itself depends on.
typst-layout = "0.15.1"
typst-ide = "0.15.1"
comemo = "0.5.1"
flate2 = "1"
tar = "0.4.46"
# The HTTP stack typst-kit's own downloader uses, configured here with
# timeouts so that a stalled download cannot hang a compile.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
hayro.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
dirs.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
