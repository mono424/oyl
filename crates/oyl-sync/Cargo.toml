[package]
name = "oyl-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oyl-model = { path = "../oyl-model" }
oyl-history = { path = "../oyl-history" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
uuid.workspace = true
async-channel.workspace = true
ureq = "3.4"
unicode-normalization = "0.1"
percent-encoding = "2"
sha2 = "0.10.9"
futures.workspace = true
smol.workspace = true
base64 = "0.22"
# The sp00ky client: the account's papers live from Oyl Cloud's database.
spooky-core = { git = "https://github.com/mono424/sp00ky", rev = "0bfbe772b3b6a6c0500647693882f94c8126c367" }

[build-dependencies]
# Rust types and the client config from schema/src/schema.surql (build.rs).
spooky-core = { git = "https://github.com/mono424/sp00ky", rev = "0bfbe772b3b6a6c0500647693882f94c8126c367", default-features = false, features = ["codegen"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[dev-dependencies]
tempfile.workspace = true
