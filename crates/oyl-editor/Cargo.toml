[package]
name = "oyl-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
oyl-ui = { path = "../oyl-ui" }
oyl-model = { path = "../oyl-model" }
typst-syntax.workspace = true
anyhow.workspace = true
log.workspace = true
# The editor's completion and hover providers speak LSP types; the version
# must match the one gpui-base is built against.
lsp-types = { version = "0.97.0", features = ["proposed"] }
# Three-way merge of external edits into a dirty buffer.
diffy = "0.5"
# Line diffs to carry the cursor across a reload.
similar = "2.7"

[dev-dependencies]
tempfile.workspace = true
# The fake rewriter and fact checker of the tests and the example answer
# through the same channels as the real ones.
async-channel.workspace = true
# GPUI's headless test platform, for the pane's UI tests (src/pane/ui_tests.rs).
# Enabled on the GPUI package gpui-kit itself uses (`gpui_kit::*` then
# re-exports the test types): gpui-kit's own `test-support` feature also
# makes Cargo resolve its optional gpui-fast backend, whose `taffy =0.15.0`
# pin conflicts with the workspace's locked taffy 0.15.1.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
