[package]
name = "oyl-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
oyl-ui = { path = "../oyl-ui" }
oyl-model = { path = "../oyl-model" }
oyl-tasks = { path = "../oyl-tasks" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
uuid.workspace = true
log.workspace = true

[dev-dependencies]
tempfile.workspace = true
# GPUI's headless test platform, for the pane's UI tests (src/ui_tests.rs).
# Enabled on the GPUI package gpui-kit itself uses, as oyl-preview does:
# gpui-kit's own `test-support` feature makes Cargo resolve its optional
# gpui-fast backend, whose taffy pin conflicts with the workspace's lock.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
